name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate gallery manifest from images/
        run: |
          python3 <<'PY'
          import json
          import os

          files = sorted(
              (
                  f
                  for f in os.listdir("images")
                  if f.lower().endswith((".jpg", ".jpeg"))
                  and os.path.isfile(os.path.join("images", f))
              ),
              reverse=True,
          )
          lines = [
              '  { "file": %s }' % json.dumps(f"images/{f}", ensure_ascii=False)
              for f in files
          ]
          body = ",\n".join(lines)
          with open("gallery.json", "w") as out:
              out.write("[\n" + body + "\n]\n" if lines else "[]\n")
          PY
      - name: Stamp deploy time and cache-bust assets
        run: |
          sed -i "s/__BUILD_TIME__/$(TZ='America/New_York' date +'%Y-%m-%d %H:%M %Z')/" index.html
          sed -i "s/__CACHE_BUST__/${GITHUB_SHA}/" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
