<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>watercolorbang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420&family=Work+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="banner">
    <h1 class="banner__title">watercolorbang</h1>
  </header>

  <main class="content">
    <section class="gallery" aria-label="Paintings">
      <div class="gallery__grid" id="gallery-grid"></div>
      <p class="gallery__empty" id="gallery-empty" hidden>paintings will appear here.</p>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox__stage" id="lightbox-stage">
      <img class="lightbox__image" id="lightbox-image" alt="">
    </div>
    <p class="lightbox__caption" id="lightbox-caption"></p>
  </div>

  <script src="gallery.js" defer></script>
</body>
</html>
