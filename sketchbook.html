<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>watercolorbang &mdash; sketchbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420&family=Work+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css?v=__CACHE_BUST__">
</head>
<body>
  <header class="banner">
    <h1 class="banner__title">watercolorbang</h1>
    <nav class="banner__nav">
      Go to: <a href="index.html">paintings</a>
    </nav>
  </header>

  <main class="content">
    <section class="gallery" aria-label="Sketches">
      <div class="gallery__grid" id="gallery-grid"></div>
      <p class="gallery__empty" id="gallery-empty" hidden>sketches will appear here.</p>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__copyright">&copy; 2026 watercolorbang. All rights reserved.</p>
    <p class="footer__version">Version __BUILD_TIME__</p>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Previous sketch">&#8249;</button>
    <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Next sketch">&#8250;</button>
    <div class="lightbox__stage" id="lightbox-stage">
      <img class="lightbox__image" id="lightbox-image" alt="">
    </div>
    <p class="lightbox__caption" id="lightbox-caption"></p>
  </div>

  <script src="gallery.js?v=__CACHE_BUST__" data-source="sketches.json" defer></script>
</body>
</html>
